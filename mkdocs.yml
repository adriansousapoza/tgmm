site_name: tgmm Documentation
site_description: A Gaussian Mixture Model implementation in PyTorch with EM/MAP estimation
site_author: Adrián A. Sousa-Poza
site_url: https://adriansousapoza.github.io/tgmm/

repo_name: adriansousapoza/tgmm
repo_url: https://github.com/adriansousapoza/tgmm
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 Adrián A. Sousa-Poza

# superpowers/ holds this project's internal SDD workflow artifacts (specs,
# plans) -- not public documentation.
exclude_docs: |
  superpowers/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/tgmm-logo.png
  favicon: assets/tgmm-logo.png

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/adriansousapoza/tgmm
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tgmm/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            group_by_category: true
            show_category_heading: true
            show_if_no_docstring: false
            inherited_members: false
            filters:
              - "!^_"
  - mkdocs-jupyter:
      include_source: true
      execute: false
      allow_errors: false
      kernel_name: python3
      ignore_h1_titles: true
      include_requirejs: true
  # Old URLs (before the tutorials were consolidated) keep working.
  - redirects:
      redirect_maps:
        notebooks/01_gmm.md: notebooks/01_introduction.ipynb
        notebooks/02_em_algorithm.md: notebooks/01_introduction.ipynb
        notebooks/03_visualise.md: notebooks/05_visualise.ipynb
        notebooks/04_cem.md: notebooks/06_cem.ipynb
        notebooks/05_supervised_gmm.md: notebooks/07_supervised_gmm.ipynb
        notebooks/06_metrics.md: notebooks/08_metrics.ipynb
        notebooks/07_sampling.md: notebooks/04_sampling.ipynb
        notebooks/08_pca_plotting.md: notebooks/09_pca_plotting.ipynb
        notebooks/09_priors.md: notebooks/10_priors.ipynb
        notebooks/10_niw_priors_comparison.md: notebooks/11_niw_priors_comparison.ipynb
        notebooks/11_dpgmm.md: notebooks/12_dpgmm.ipynb
        notebooks/12_hdbscan.md: notebooks/13_hdbscan.ipynb
        notebooks/13_model_selection.md: notebooks/14_model_selection.ipynb
        notebooks/14_stochastic_em.md: notebooks/15_stochastic_em.ipynb
        notebooks/15_covariance_models.md: notebooks/02_covariance_types.ipynb
        user-guide/gaussian-mixture.md: notebooks/01_introduction.ipynb
        user-guide/gpcm-covariance-models.md: notebooks/02_covariance_types.ipynb
        user-guide/gmm-initializer.md: notebooks/03_initialization.ipynb
        user-guide/plotting.md: notebooks/05_visualise.ipynb
        user-guide/clustering-metrics.md: notebooks/08_metrics.ipynb
        user-guide/other-mixture-families.md: notebooks/16_student_t.ipynb
        user-guide/semi-supervised-pu.md: notebooks/18_semi_supervised_pu.ipynb
        user-guide/noise-missing-conditioning.md: notebooks/19_noise_missing_conditioning.ipynb
        explainers/gpcm-shapes.md: notebooks/02_covariance_types.ipynb
        explainers/em-stepper.md: notebooks/01_introduction.ipynb
        explainers/annealing.md: notebooks/15_stochastic_em.ipynb
        explainers/metrics-intuition.md: notebooks/08_metrics.ipynb
        explainers/data-designer.md: notebooks/01_introduction.ipynb

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Tutorials:
      - Overview: tutorials/index.md
      - "1. Introduction: Gaussian Mixtures and EM": notebooks/01_introduction.ipynb
      - 2. Covariance Types (6 classic + 14 GPCM): notebooks/02_covariance_types.ipynb
      - 3. Initialization: notebooks/03_initialization.ipynb
      - 4. Sampling: notebooks/04_sampling.ipynb
      - 5. Visualization: notebooks/05_visualise.ipynb
      - 6. Classification EM (CEM): notebooks/06_cem.ipynb
      - 7. Supervised Fitting: notebooks/07_supervised_gmm.ipynb
      - 8. Metrics and Evaluation: notebooks/08_metrics.ipynb
      - 9. PCA Plotting: notebooks/09_pca_plotting.ipynb
      - 10. Priors (MAP): notebooks/10_priors.ipynb
      - 11. NIW Priors Comparison: notebooks/11_niw_priors_comparison.ipynb
      - 12. Dirichlet Process Mixtures: notebooks/12_dpgmm.ipynb
      - 13. HDBSCAN: notebooks/13_hdbscan.ipynb
      - 14. Model Selection (BIC, AIC, ICL): notebooks/14_model_selection.ipynb
      - 15. Stochastic EM, Annealing and SAEM: notebooks/15_stochastic_em.ipynb
      - 16. Student-t Mixtures: notebooks/16_student_t.ipynb
      - 17. Von Mises-Fisher Mixtures: notebooks/17_von_mises_fisher.ipynb
      - 18. Semi-Supervised and PU Fitting: notebooks/18_semi_supervised_pu.ipynb
      - 19. Noise, Missing Values and Conditioning: notebooks/19_noise_missing_conditioning.ipynb
      - 20. Constraints, Frozen Components and Sample Weights: notebooks/20_constraints_and_weights.ipynb
  - API Reference:
      - tgmm.GaussianMixture: api/gaussian-mixture.md
      - GPCM Covariance: api/covariance-gpcm.md
      - tgmm.BaseMixture: api/base-mixture.md
      - tgmm.StudentTMixture: api/student-t-mixture.md
      - tgmm.ConditionalGaussianMixture: api/conditional-gaussian-mixture.md
      - tgmm.GenericMixture: api/generic-mixture.md
      - tgmm.VonMisesFisherMixture: api/vmf-mixture.md
      - tgmm.PositiveUnlabeledMixture: api/positive-unlabeled-mixture.md
      - tgmm.GMMInitializer: api/gmm-initializer.md
      - tgmm.ClusteringMetrics: api/clustering-metrics.md
      - tgmm.plotting: api/plotting.md
      - tgmm.SufficientStats: api/sufficient-stats.md
      - tgmm.constraints: api/constraints.md
      - Model Selection: api/model-selection.md
  - Contributing: contributing.md
